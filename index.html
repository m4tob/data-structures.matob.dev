<body>

  <div class="container mt-2 mt-md-4">

    <!-- a troca de aba e feita pelo script no fim desta pagina, nao pelo JS do
         Bootstrap: as classes abaixo sao so de estilo -->
    <ul class="nav nav-tabs mt-1" id="myTab" role="tablist">
      <li class="nav-item">
        <a class="nav-link active" id="queue-tab" href="#Queue" role="tab" aria-controls="Queue" aria-selected="true">Fila</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="stack-tab" href="#Stack" role="tab" aria-controls="Stack" aria-selected="false">Pilha</a>
      </li>
    </ul>

    <div id="myTabContent" class="tab-content mt-0">
      <div class="tab-pane fade show active" id="Queue" role="tabpanel" aria-labelledby="queue-tab">
        <iframe src="queue.html" style="width:100%; height:600px; overflow: none;" frameborder="0"></iframe>
      </div>
      <div class="tab-pane fade" id="Stack" role="tabpanel" aria-labelledby="stack-tab">
        <iframe src="stack.html" style="width:100%; height:600px; overflow: none;" frameborder="0"></iframe>
      </div>
    </div>
  </div>

  <script>
    // Troca de aba em JavaScript puro. Antes isso vinha do JS do Bootstrap, que
    // por sua vez exigia o jQuery: duas bibliotecas, 129 KB, para alternar duas
    // abas. O comportamento e o mesmo, incluindo o fade, que e do CSS.
    (function () {
      var abas = document.querySelectorAll('#myTab .nav-link');
      var paineis = document.querySelectorAll('#myTabContent .tab-pane');

      function ativar(aba) {
        var alvo = document.querySelector(aba.getAttribute('href'));
        if (!alvo) return;

        abas.forEach(function (a) {
          a.classList.remove('active');
          a.setAttribute('aria-selected', 'false');
        });
        paineis.forEach(function (p) { p.classList.remove('show', 'active'); });

        aba.classList.add('active');
        aba.setAttribute('aria-selected', 'true');
        alvo.classList.add('active');
        // 'show' so no quadro seguinte, senao a transicao de opacidade nao roda
        requestAnimationFrame(function () { alvo.classList.add('show'); });
      }

      abas.forEach(function (aba) {
        aba.addEventListener('click', function (ev) {
          ev.preventDefault();
          ativar(aba);
        });
      });
    })();
  </script>
