<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- este arquivo e o que desliga o modo SPA do Cloudflare Pages: sem um 404.html na
       raiz, qualquer caminho inexistente responde 200 com a home -->
  <title>Página não encontrada - Estruturas de Dados</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- estilo embutido de proposito: a pagina de erro nao deve depender do CDN -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 24px; background: #f6f8fa; color: #212529;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
    }
    .card {
      background: #fff; border: 1px solid #dee2e6; border-radius: 14px;
      padding: 44px 40px; max-width: 460px; text-align: center;
    }
    .fila { display: flex; gap: 6px; justify-content: center; }
    .fila span {
      width: 40px; height: 40px; border: 1px solid #dee2e6; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; font-weight: 600;
      color: #495057;
    }
    .fila span.on { background: #007bff; border-color: #007bff; color: #fff; }
    .code { margin: 20px 0 0; font-size: 40px; font-weight: 700; letter-spacing: -1px; }
    h1 { margin: 4px 0 0; font-size: 19px; font-weight: 600; }
    p.text { margin: 12px 0 0; color: #6c757d; font-size: 15px; }
    a.btn {
      display: inline-block; margin-top: 26px; padding: 11px 22px; border-radius: 10px;
      background: #007bff; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
    }
    a.btn:hover { background: #0069d9; }
  </style>
</head>

<body>
  <main class="card">
    <div class="fila"><span class="on">4</span><span>0</span><span class="on">4</span></div>
    <p class="code">404</p>
    <h1>Essa página não existe</h1>
    <p class="text">Procurou um elemento que não está na fila. A fila e a pilha estão na
      página inicial.</p>
    <a class="btn" href="/">Ir para as estruturas</a>
  </main>
</body>

</html>
